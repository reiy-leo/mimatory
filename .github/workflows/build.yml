# Native packages (unsigned): macOS (universal .dmg/.app), Windows (msi / nsis), Linux (AppImage / deb, Wayland
# only), Android (debug APK, arm64). Run by hand (Actions → Build apps) or by pushing a v* tag; artifacts are
# uploaded either way, and a tag creates a draft prerelease with the APK attached. Alpha tags (v*-alpha*) build
# macOS only and publish the prerelease directly (Rei, 2026-10-17). iOS is ios.yml (manual). No repository secrets are used; signing is
# documented in AGENTS.md "Platforms".
name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Alpha tags (v*-alpha*) build macOS only; every other run builds all desktop platforms and Android.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      alpha: ${{ steps.plan.outputs.alpha }}
    steps:
      - id: plan
        shell: python
        run: |
          import json, os
          ref = os.environ["GITHUB_REF"]
          alpha = ref.startswith("refs/tags/") and "-alpha" in ref
          mac = {"name": "macOS (universal)", "os": "macos-latest", "args": "--target universal-apple-darwin",
                 "rust-targets": "aarch64-apple-darwin,x86_64-apple-darwin", "artifact": "mimatory-macos",
                 "bundle": "src-tauri/target/universal-apple-darwin/release/bundle"}
          win = {"name": "Windows", "os": "windows-latest", "args": "", "rust-targets": "",
                 "artifact": "mimatory-windows", "bundle": "src-tauri/target/release/bundle"}
          linux = {"name": "Linux (Wayland)", "os": "ubuntu-22.04", "args": "", "rust-targets": "",
                   "artifact": "mimatory-linux", "bundle": "src-tauri/target/release/bundle"}
          include = [mac] if alpha else [mac, win, linux]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"include": include}) + "\n")
              f.write("alpha=" + ("true" if alpha else "false") + "\n")

  desktop:
    name: Desktop ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies (WebKitGTK, appindicator)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Package
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Google Drive sync (src-tauri/src/sync/oauth.rs reads these at compile time). Unset secrets leave
          # them empty, and the build then offers WebDAV only, with Google shown as not configured.
          MIMATORY_GOOGLE_CLIENT_ID: ${{ secrets.MIMATORY_GOOGLE_CLIENT_ID }}
          MIMATORY_GOOGLE_CLIENT_SECRET: ${{ secrets.MIMATORY_GOOGLE_CLIENT_SECRET }}
        with:
          tauriScript: npx tauri
          args: ${{ matrix.args }}
          # Only a tag creates the draft Release; a manual run only uploads artifacts.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Mimatory ${{ github.ref_name }}
          # Alpha tags publish a prerelease right away; other tags stay drafts for review.
          releaseDraft: ${{ needs.plan.outputs.alpha != 'true' }}
          prerelease: true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            ${{ matrix.bundle }}/dmg/*.dmg
            ${{ matrix.bundle }}/macos/*.app.tar.gz
            ${{ matrix.bundle }}/msi/*.msi
            ${{ matrix.bundle }}/nsis/*.exe
            ${{ matrix.bundle }}/appimage/*.AppImage
            ${{ matrix.bundle }}/deb/*.deb

  android:
    name: Android (debug APK)
    needs: plan
    if: needs.plan.outputs.alpha != 'true'
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install the NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # src-tauri/gen/ is not committed (.gitignore): the Android project is generated here.
      - name: tauri android init
        run: |
          if [ ! -d src-tauri/gen/android ]; then npx tauri android init --ci; fi

      - name: Debug APK (arm64)
        run: npx tauri android build --apk --debug --target aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: mimatory-android-debug
          if-no-files-found: error
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  # On a tag, attach the APK to the draft Release the desktop jobs created (alpha tags too, as in Mindough).
  release-android:
    name: Attach APK to the Release
    if: startsWith(github.ref, 'refs/tags/') && needs.plan.outputs.alpha != 'true'
    needs: [plan, desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mimatory-android-debug
          path: apk
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          f=$(find apk -name '*.apk' | head -1)
          cp "$f" "Mimatory-${GITHUB_REF_NAME}-android-arm64-debug.apk"
          gh release upload "$GITHUB_REF_NAME" "Mimatory-${GITHUB_REF_NAME}-android-arm64-debug.apk" --clobber -R "$GITHUB_REPOSITORY"
