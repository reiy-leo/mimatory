# Checks on every push and pull request: lint, types, tests, the web bundle, and `cargo check` of the Rust side
# on Linux (Wayland-only build: tauri without its x11 feature). No secrets needed.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  rust:
    name: cargo check (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies (WebKitGTK, appindicator)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      # tauri-build reads ../dist at compile time; an empty one is enough for a check.
      - run: mkdir -p dist
      - name: cargo check --tests
        working-directory: src-tauri
        run: cargo check --tests --locked
      - name: No X11 backend linked
        working-directory: src-tauri
        run: |
          if cargo tree -i x11-dl >/dev/null 2>&1 || cargo tree -i gdkx11 >/dev/null 2>&1; then
            echo "x11-dl / gdkx11 came back into the Linux build"; exit 1
          fi
